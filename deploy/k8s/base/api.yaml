apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictira-api
  labels: {app.kubernetes.io/name: predictira, app.kubernetes.io/component: api}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: predictira, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: predictira, app.kubernetes.io/component: api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: predictira:2.0.0
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: predictira-config}}]
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: predictira-api
spec:
  selector: {app.kubernetes.io/name: predictira, app.kubernetes.io/component: api}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: predictira-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: predictira, app.kubernetes.io/component: api}
